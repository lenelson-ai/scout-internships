name: Refresh Scout
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'
permissions:
  contents: read
concurrency:
  group: scout-shared-state
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore durable scanner state (fail closed)
        id: restore
        run: python -m scripts.deployment_state restore
      - name: Regression and frontend tests
        run: |
          python -m unittest discover -s tests -q
          node --test tests/site.test.cjs
      - name: Scan due sources and validate publication
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.scan_shared --db shared-state/scout.sqlite3
          python -m scripts.validate_public_site
      - name: Persist committed work even after scan or export failure
        id: checkpoint
        if: always() && steps.restore.outcome == 'success' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure' || steps.scan.outcome == 'cancelled')
        run: python -m scripts.deployment_state persist
      - name: Save operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-operation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            shared-state/restore.json
            shared-state/run-metrics.json
            shared-state/operations.json
            shared-state/production-health.md
            shared-state/checkpoint-result.json
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.scan.outcome == 'success' && steps.checkpoint.outcome == 'success'
        with:
          path: site
  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
